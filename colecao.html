    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            margin: 0;
            background: #fff;
            color: #111;
        }

        a {
            color: inherit;
        }

        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .marca img {
            display: block;
            width: 125px;
            max-height: 48px;
            object-fit: contain;
        }

        .voltar {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border: 1px solid currentColor;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-decoration: none;
        }

        .navegacao-colecoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: min(1180px, calc(100% - 40px));
            margin: 22px auto 0;
        }

        .navegacao-colecoes a {
            padding: 10px 16px;
            border: 1px solid rgba(128, 128, 128, .35);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-decoration: none;
        }

        .navegacao-colecoes a[aria-current="page"] {
            background: #111;
            color: #fff;
        }

        main {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 42px 0 78px;
        }

        .introducao {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, .85fr);
            align-items: center;
            gap: clamp(24px, 5vw, 64px);
            margin-bottom: 54px;
        }

        .introducao-texto {
            max-width: 600px;
        }

        .etiqueta {
            margin: 0 0 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2em;
            opacity: .62;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(34px, 6vw, 64px);
            letter-spacing: .05em;
        }

        .introducao-texto > p:last-child {
            max-width: 540px;
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            opacity: .72;
        }

        .imagem-capa {
            width: 100%;
            max-height: 410px;
            aspect-ratio: 4 / 3;
            border-radius: 18px;
            object-fit: cover;
            background: #eee;
        }

        .rodape img {
            display: block;
            width: 110px;
            max-height: 42px;
            margin: 0 auto 12px;
            object-fit: contain;
        }

        .aviso-disponibilidade {
            margin: -28px 0 28px;
            font-size: 12px;
            line-height: 1.6;
            opacity: .7;
        }

        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .estado-colecao {
            grid-column: 1 / -1;
            margin: 24px 0;
            text-align: center;
            line-height: 1.6;
        }

        .produto {
            overflow: hidden;
            border: 1px solid rgba(128, 128, 128, .28);
            border-radius: 18px;
            background: rgba(128, 128, 128, .04);
        }

        .produto-imagem {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #f1f1f1;
        }

        .produto-imagem img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .produto-imagem .botao-favorito {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1;
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(128, 128, 128, .45);
            border-radius: 50%;
            background: rgba(255, 255, 255, .88);
            color: #333;
            font-size: 24px;
            cursor: pointer;
        }

        .botao-favorito.ativo .coracao { color: #e60035; }

        .produto-info {
            padding: 18px;
        }

        .produto-etiqueta {
            margin: 0 0 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .16em;
            opacity: .58;
        }

        .produto h2 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .produto-preco {
            min-height: 22px;
            margin: 0 0 16px;
            font-size: 15px;
            font-weight: 700;
        }

        .rodape {
            padding: 24px 20px;
            border-top: 1px solid rgba(128, 128, 128, .28);
            font-size: 12px;
            text-align: center;
            opacity: .68;
        }

        .erro-colecao {
            padding: 60px 0;
            text-align: center;
        }

        .erro-colecao a {
            font-weight: 700;
        }

        @media (max-width: 760px) {
            .introducao {
                grid-template-columns: 1fr;
                gap: 24px;
                margin-bottom: 38px;
            }

            .imagem-capa {
                max-height: 360px;
            }

            .produtos-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .produto-info {
                padding: 14px;
            }
        }

        @media (max-width: 420px) {
            .cabecalho,
            .navegacao-colecoes,
            main {
                width: calc(100% - 28px);
            }

            .cabecalho {
                gap: 10px;
            }

            .marca img {
                width: 105px;
            }

            .voltar {
                padding: 0 11px;
                font-size: 10px;
            }

            .navegacao-colecoes {
                gap: 6px;
            }

            .navegacao-colecoes a {
                flex: 1;
                padding: 10px 5px;
                font-size: 9px;
                text-align: center;
            }

            .produtos-grid {
                gap: 10px;
            }

            .produto-info {
                padding: 11px;
            }

            .produto h2 {
                font-size: 14px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root,
            body {
                background: #090909;
                color: #f5f5f5;
            }

            .marca img {
                filter: brightness(0) invert(1);
            }

            .cabecalho {
                border-color: #292929;
            }

            .navegacao-colecoes a[aria-current="page"] {
                background: #f5f5f5;
                color: #111;
            }

            .produto {
                border-color: #292929;
                background: #111;
            }

            .produto-imagem,
            .imagem-capa {
                background: #1b1b1b;
            }

            .rodape {
                border-color: #292929;
            }

            .rodape img {
                filter: brightness(0) invert(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
        </style>

    <body class="fran7-subpage">
    <header class="cabecalho">
        <a class="marca" href="inicio.html" aria-label="FRAN7, voltar à loja">
            <img src="assets/images/logo.png.png" alt="FRAN7">
        </a>
        <a class="voltar" href="inicio.html#produtos">VOLTAR À LOJA</a>
    </header>

    <nav class="navegacao-colecoes" aria-label="Coleções FRAN7">
        <a href="colecao.html?categoria=homens" data-categoria-link="homens">HOMENS</a>
        <a href="colecao.html?categoria=mulheres" data-categoria-link="mulheres">MULHERES</a>
        <a href="colecao.html?categoria=criancas" data-categoria-link="criancas">CRIANÇAS</a>
    </nav>

    <main id="conteudoColecao"></main>

    <footer class="rodape">
        © 2026 FRAN7. Todos os direitos reservados. | Grief &amp; Glory — Nascida do luto, feita para o legado.
    </footer>

    <script>
        const colecoes = {
            homens: {
                titulo: "HOMENS",
                etiqueta: "FRAN7 PERFORMANCE",
                descricao: "Descobre os modelos FRAN7 e consulta connosco os tamanhos e a disponibilidade antes de fazer o teu pedido.",
                capa: "assets/images/a3.jpeg"
            },
            mulheres: {
                titulo: "MULHERES",
                etiqueta: "FRAN7 COLLECTION",
                descricao: "Explora os modelos FRAN7. Fala connosco para confirmar os tamanhos, o corte e a disponibilidade de cada peça.",
                capa: "assets/images/mulheres.jpeg"
            },
            criancas: {
                titulo: "CRIANÇAS",
                etiqueta: "FRAN7 JUNIOR",
                descricao: "Uma coleção para os pequenos atletas. Consulta connosco os tamanhos infantis e a disponibilidade antes de fazer o pedido.",
                capa: "assets/images/a1.jpeg"
            }
        };

        const categoria =
            new URLSearchParams(window.location.search).get("categoria");
        const colecao = colecoes[categoria];
        const conteudo = document.getElementById("conteudoColecao");

        if (!colecao) {
            document.title = "Coleção não encontrada | FRAN7";
            conteudo.innerHTML = `
                <section class="erro-colecao">
                    <h1>COLEÇÃO NÃO ENCONTRADA</h1>
                    <p>Escolhe uma das coleções para continuar.</p>
                    <a href="inicio.html#produtos">Voltar à loja</a>
                </section>
            `;
        } else {
            document.title = `${colecao.titulo} | FRAN7`;
            document.querySelector(`[data-categoria-link="${categoria}"]`)
                .setAttribute("aria-current", "page");

            window.FRAN7_COLLECTION_PAGE = colecao;
            conteudo.innerHTML = `
                <section class="introducao" aria-labelledby="tituloColecao">
                    <div class="introducao-texto">
                        <p class="etiqueta">${colecao.etiqueta}</p>
                        <h1 id="tituloColecao">${colecao.titulo}</h1>
                        <p>${colecao.descricao}</p>
                    </div>
                    <img class="imagem-capa" src="${colecao.capa}" alt="Coleção FRAN7 ${colecao.titulo.toLowerCase()}">
                </section>
                <p class="aviso-disponibilidade">Os tamanhos e a disponibilidade podem variar. Confirma os detalhes connosco antes do pedido.</p>
                <section class="produtos-grid" aria-label="Modelos da coleção ${colecao.titulo}">
                    <p class="estado-colecao" role="status">A carregar produtos...</p>
                </section>
            `;
        }
    </script>
