<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Redefinir palavra-passe | FRAN7</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background: #f5f5f2;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(440px, 100%);
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid #deded8;
            background: #fff;
            box-shadow: 0 16px 50px rgba(0, 0, 0, .1);
        }

        .brand {
            margin: 0 0 10px;
            color: #686860;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .18em;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 500;
        }

        .intro,
        .status {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 12px;
            border: 1px solid #aaa;
            border-radius: 0;
            background: #fff;
            color: #171717;
            font: inherit;
        }

        button,
        .back-link {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 11px 16px;
            border: 1px solid #171717;
            background: #171717;
            color: #fff;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .back-link {
            margin-top: 18px;
            border-color: #aaa;
            background: transparent;
            color: #171717;
        }

        .status {
            margin: 18px 0 0;
        }

        .status[data-error="true"] {
            color: #a00000;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <main>
        <p class="brand">FRAN7 · CONTA</p>
        <h1>Nova palavra-passe</h1>
        <p class="intro">Escolhe uma nova palavra-passe para voltares a aceder à tua conta.</p>

        <form id="formRedefinir" hidden>
            <label for="novaSenha">Nova palavra-passe</label>
            <input id="novaSenha" name="password" type="password" autocomplete="new-password" minlength="8" required>

            <label for="confirmarSenha">Confirmar palavra-passe</label>
            <input id="confirmarSenha" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required>

            <button type="submit">GUARDAR NOVA PALAVRA-PASSE</button>
        </form>

        <p class="status" id="estado" role="status" aria-live="polite" hidden></p>
        <a class="back-link" href="registo.html?modo=login">Voltar ao login</a>
    </main>

    <script src="assets/js/fran7-checkout-config.js?v=20261031-2"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <script src="assets/js/pocketbase-auth.js?v=20261031-5"></script>
    <script>
        (function() {
            "use strict";

            const token = new URLSearchParams(window.location.search).get("token") || "";
            const form = document.getElementById("formRedefinir");
            const status = document.getElementById("estado");

            function showStatus(message, isError) {
                status.textContent = message;
                status.dataset.error = String(Boolean(isError));
                status.hidden = false;
            }

            if (!token) {
                showStatus("Este link de recuperação é inválido ou está incompleto. Solicita um novo link.", true);
            } else {
                form.hidden = false;
            }

            form.addEventListener("submit", async function(event) {
                event.preventDefault();
                const password = document.getElementById("novaSenha").value;
                const confirmation = document.getElementById("confirmarSenha").value;
                const submit = form.querySelector('button[type="submit"]');

                if (password.length < 8) {
                    showStatus("A palavra-passe deve ter pelo menos 8 caracteres.", true);
                    return;
                }
                if (password !== confirmation) {
                    showStatus("As palavras-passe não coincidem.", true);
                    return;
                }

                submit.disabled = true;
                submit.textContent = "A GUARDAR…";
                status.hidden = true;
                try {
                    await window.Fran7PocketBaseAuth.redefinirPalavraPasse(
                        token,
                        password,
                        confirmation
                    );
                    form.hidden = true;
                    showStatus("Palavra-passe atualizada. Já podes iniciar sessão.", false);
                } catch (error) {
                    showStatus(error.message || "Não foi possível redefinir a palavra-passe.", true);
                } finally {
                    submit.disabled = false;
                    submit.textContent = "GUARDAR NOVA PALAVRA-PASSE";
                }
            });
        })();
    </script>
</body>
</html>
