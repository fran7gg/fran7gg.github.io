    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
        }

        a {
            color: inherit;
        }

        .cabecalho-catalogo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 24px 0;
            border-bottom: 1px solid #ddd;
        }

        .marca img {
            display: block;
            width: 130px;
            max-height: 50px;
            object-fit: contain;
            text-decoration: none;
        }

        .voltar-loja {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 0 17px;
            border: 1px solid currentColor;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-decoration: none;
            transition: background-color .2s ease, color .2s ease;
        }

        .voltar-loja:hover {
            background: #111;
            color: #fff;
        }

        main {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 62px 0 80px;
        }

        .intro {
            max-width: 700px;
            margin: 0 auto 42px;
            text-align: center;
        }

        .intro-etiqueta {
            margin: 0 0 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2em;
            opacity: .62;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(30px, 5vw, 52px);
            letter-spacing: .06em;
        }

        .intro p:last-child {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            opacity: .7;
        }

        .modelos-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .modelo {
            overflow: hidden;
            border: 1px solid rgba(128, 128, 128, .28);
            border-radius: 18px;
            background: rgba(128, 128, 128, .04);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .modelo:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .12);
        }

        .modelo-imagem {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #f2f2f2;
        }

        .modelo-imagem img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }

        .modelo-imagem .botao-favorito,
        .produto-imagem .botao-favorito {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1;
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(128, 128, 128, .45);
            border-radius: 50%;
            background: rgba(255, 255, 255, .88);
            color: #333;
            font-size: 24px;
            cursor: pointer;
        }

        .botao-favorito.ativo .coracao { color: #e60035; }

        .modelo:hover .modelo-imagem img {
            transform: scale(1.035);
        }

        .modelo-info {
            padding: 18px;
        }

        .modelo-etiqueta {
            margin: 0 0 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .16em;
            opacity: .58;
        }

        .modelo h2 {
            margin: 0 0 9px;
            font-size: 17px;
        }

        .modelo-preco {
            min-height: 22px;
            margin: 0 0 16px;
            font-size: 15px;
            font-weight: 700;
        }

        .modelo-pedir {
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid rgba(128, 128, 128, .4);
            border-radius: 12px;
            background: rgba(128, 128, 128, .1);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-align: center;
            text-decoration: none;
            transition: background-color .2s ease, border-color .2s ease;
        }

        .modelo-pedir:hover {
            border-color: #25d366;
            background: #25d366;
            color: #fff;
        }

        .rodape-catalogo {
            padding: 24px 20px;
            border-top: 1px solid rgba(128, 128, 128, .28);
            font-size: 12px;
            text-align: center;
            opacity: .68;
        }

        .rodape-catalogo img {
            display: block;
            width: 110px;
            max-height: 42px;
            margin: 0 auto 12px;
            object-fit: contain;
        }

        @media (max-width: 760px) {
            .modelos-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            main {
                padding-top: 42px;
            }

            .modelo-info {
                padding: 14px;
            }

            .modelo h2 {
                font-size: 15px;
            }
        }

        @media (max-width: 420px) {
            .cabecalho-catalogo,
            main {
                width: calc(100% - 28px);
            }

            .cabecalho-catalogo {
                gap: 10px;
            }

            .marca img {
                width: 110px;
            }

            .voltar-loja {
                padding: 0 12px;
                font-size: 10px;
            }

            .modelos-grid {
                gap: 10px;
            }

            .modelo-info {
                padding: 11px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root,
            body {
                background: #090909;
                color: #f5f5f5;
            }

            .marca img {
                filter: brightness(0) invert(1);
            }

            .cabecalho-catalogo {
                border-color: #292929;
            }

            .voltar-loja:hover {
                background: #f5f5f5;
                color: #111;
            }

            .modelo {
                border-color: #292929;
                background: #111;
            }

            .modelo-imagem {
                background: #1b1b1b;
            }

            .rodape-catalogo {
                border-color: #292929;
            }

            .rodape-catalogo img {
                filter: brightness(0) invert(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
        </style>
