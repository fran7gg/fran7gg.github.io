<!-- =====================================================
     FRAN7 AI
===================================================== -->

<style>
    #fran7-ai-button {
        position: fixed;
        right: 25px;
        bottom: 25px;
        width: 58px;
        height: 58px;
        border: none;
        border-radius: 50%;
        background: #000;
        color: #fff;
        font-size: 25px;
        cursor: pointer;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 30px rgba(0,0,0,.25);
        transition: transform .2s ease;
    }

    #fran7-ai-button:hover {
        transform: scale(1.08);
    }

    #fran7-ai-window {
        position: fixed;
        right: 25px;
        bottom: 95px;
        width: 360px;
        max-width: calc(100vw - 30px);
        height: 520px;
        max-height: calc(100vh - 120px);
        background: #fff;
        color: #000;
        border: 1px solid #ddd;
        border-radius: 20px;
        overflow: hidden;
        z-index: 99999;
        display: none;
        flex-direction: column;
        box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .fran7-ai-header {
        padding: 18px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .fran7-ai-title {
        font-weight: 800;
        font-size: 16px;
    }

    .fran7-ai-status {
        font-size: 11px;
        margin-top: 3px;
        opacity: .8;
    }

    .fran7-ai-close {
        border: none;
        background: transparent;
        color: #fff;
        font-size: 25px;
        cursor: pointer;
    }

    #fran7-ai-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .fran7-ai-message {
        max-width: 85%;
        padding: 11px 14px;
        border-radius: 15px;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
    }

    .fran7-ai-message.bot {
        align-self: flex-start;
        background: #f1f1f1;
        color: #000;
    }

    .fran7-ai-message.user {
        align-self: flex-end;
        background: #000;
        color: #fff;
    }

    .fran7-ai-quick {
        display: flex;
        gap: 7px;
        padding: 10px 12px;
        overflow-x: auto;
        border-top: 1px solid #eee;
    }

    .fran7-ai-quick button {
        white-space: nowrap;
        border: 1px solid #ccc;
        background: transparent;
        color: inherit;
        border-radius: 20px;
        padding: 7px 11px;
        cursor: pointer;
        font-size: 12px;
    }

    .fran7-ai-input-area {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eee;
    }

    #fran7-ai-input {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 20px;
        padding: 11px 14px;
        outline: none;
        background: #fff;
        color: #000;
    }

    #fran7-ai-send {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: #000;
        color: #fff;
        cursor: pointer;
        font-size: 17px;
    }

    #fran7-ai-send:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    @media (prefers-color-scheme: dark) {

        #fran7-ai-window {
            background: #000;
            color: #fff;
            border-color: #333;
        }

        .fran7-ai-header {
            background: #fff;
            color: #000;
        }

        .fran7-ai-close {
            color: #000;
        }

        .fran7-ai-message.bot {
            background: #181818;
            color: #fff;
        }

        .fran7-ai-message.user {
            background: #fff;
            color: #000;
        }

        .fran7-ai-quick {
            border-color: #333;
        }

        .fran7-ai-quick button {
            border-color: #555;
            color: #fff;
        }

        #fran7-ai-input {
            background: #111;
            color: #fff;
            border-color: #444;
        }

        #fran7-ai-send {
            background: #fff;
            color: #000;
        }

        #fran7-ai-button {
            background: #fff;
            color: #000;
        }
    }

    @media (max-width: 500px) {

        #fran7-ai-window {
            right: 10px;
            bottom: 80px;
            width: calc(100vw - 20px);
            height: 70vh;
        }

        #fran7-ai-button {
            right: 15px;
            bottom: 15px;
        }
    }
</style>


<button
    id="fran7-ai-button"
    type="button"
    aria-label="Abrir FRAN7 AI"
>
    ✦
</button>


<div id="fran7-ai-window">

    <div class="fran7-ai-header">

        <div>
            <div class="fran7-ai-title">
                FRAN7 AI
            </div>

            <div class="fran7-ai-status">
                ● Assistente online
            </div>
        </div>

        <button
            class="fran7-ai-close"
            id="fran7-ai-close"
            type="button"
            aria-label="Fechar FRAN7 AI"
        >
            ×
        </button>

    </div>


    <div id="fran7-ai-messages">

        <div class="fran7-ai-message bot">
            Olá! 👋 Sou o FRAN7 AI.
            Como posso ajudar?
        </div>

    </div>


    <div class="fran7-ai-quick">

        <button type="button" data-ai-question="Quais produtos a FRAN7 tem?">
            Produtos
        </button>

        <button type="button" data-ai-question="Quais são os tamanhos disponíveis?">
            Tamanhos
        </button>

        <button type="button" data-ai-question="Como funcionam as entregas?">
            Entregas
        </button>

    </div>


    <div class="fran7-ai-input-area">

        <input
            id="fran7-ai-input"
            type="text"
            placeholder="Escreve a tua pergunta..."
            autocomplete="off"
        >

        <button
            id="fran7-ai-send"
            type="button"
            aria-label="Enviar mensagem"
        >
            ➤
        </button>

    </div>

</div>


<script>

(function () {

    const URL_FRAN7_AI =
        "https://pqvnqloukcwwtavdyjry.supabase.co/functions/v1/fran7-ai";


    const botaoAbrir =
        document.getElementById("fran7-ai-button");

    const janela =
        document.getElementById("fran7-ai-window");

    const botaoFechar =
        document.getElementById("fran7-ai-close");

    const mensagens =
        document.getElementById("fran7-ai-messages");

    const campo =
        document.getElementById("fran7-ai-input");

    const botaoEnviar =
        document.getElementById("fran7-ai-send");


    function abrirAI() {

        janela.style.display = "flex";

        setTimeout(function () {
            campo.focus();
        }, 100);

    }


    function fecharAI() {

        janela.style.display = "none";

    }


    function adicionarMensagem(texto, tipo) {

        const mensagem =
            document.createElement("div");

        mensagem.className =
            "fran7-ai-message " + tipo;

        mensagem.textContent =
            texto;

        mensagens.appendChild(mensagem);

        mensagens.scrollTop =
            mensagens.scrollHeight;

        return mensagem;

    }


    async function enviarMensagem(texto) {

        texto = texto.trim();

        if (!texto) {
            return;
        }


        adicionarMensagem(
            texto,
            "user"
        );


        campo.value = "";

        botaoEnviar.disabled = true;


        const carregando =
            adicionarMensagem(
                "A preparar resposta...",
                "bot"
            );


        try {

            const resposta =
                await fetch(
                    URL_FRAN7_AI,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            mensagem: texto
                        })
                    }
                );


            const dados =
                await resposta.json();


            carregando.remove();


            if (!resposta.ok) {

                console.error(
                    "Erro FRAN7 AI:",
                    dados
                );

                adicionarMensagem(
                    dados?.detalhes ||
                    dados?.error ||
                    "Desculpe, ocorreu um erro. Tenta novamente.",
                    "bot"
                );

                return;
            }


            const respostaAI =
                dados?.reply ||
                "Desculpe, não consegui responder neste momento.";


            adicionarMensagem(
                respostaAI,
                "bot"
            );


        } catch (erro) {

            console.error(
                "Erro de ligação ao FRAN7 AI:",
                erro
            );


            carregando.remove();


            adicionarMensagem(
                "Não foi possível ligar ao FRAN7 AI. Verifica a tua ligação e tenta novamente.",
                "bot"
            );


        } finally {

            botaoEnviar.disabled =
                false;

            campo.focus();

        }

    }


    botaoAbrir.addEventListener(
        "click",
        abrirAI
    );


    botaoFechar.addEventListener(
        "click",
        fecharAI
    );


    botaoEnviar.addEventListener(
        "click",
        function () {

            enviarMensagem(
                campo.value
            );

        }
    );


    campo.addEventListener(
        "keydown",
        function (evento) {

            if (evento.key === "Enter") {

                evento.preventDefault();

                enviarMensagem(
                    campo.value
                );

            }

        }
    );


    document
        .querySelectorAll(
            "[data-ai-question]"
        )
        .forEach(function (botao) {

            botao.addEventListener(
                "click",
                function () {

                    enviarMensagem(
                        botao.dataset.aiQuestion
                    );

                }
            );

        });


})();

</script>
