        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;

        body {
            min-width: 0;
            min-height: 100vh;
            margin: 0;
            background: #080808;
            display: flex;
            flex-direction: column;
        }

        .cabecalho {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px max(5%, calc((100% - 1120px) / 2));
            border-bottom: 1px solid #292929;
            background: rgba(8, 8, 8, .96);
        }

        .marca img {
            display: block;
            width: 140px;
            max-height: 52px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .voltar-loja {
            margin-left: auto;
            color: #ddd;
            font-size: 11px;
            letter-spacing: .08em;
            text-decoration: none;
        }

        main {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 70px 0 100px;
            flex: 1;
        }

        .rodape {
            padding: 24px 20px;
            border-top: 1px solid #292929;
            color: #aaa;
            font-size: 12px;
            text-align: center;
        }

        .rodape img {
            display: block;
            width: 110px;
            max-height: 42px;
            margin: 0 auto 12px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .intro {
            margin-bottom: 36px;
        }

        .intro-label {
            color: #929292;
            font-size: 10px;
            letter-spacing: .3em;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(36px, 6vw, 58px);
            letter-spacing: -.04em;
        }

        .intro p:last-child {
            color: #999;
            font-size: 14px;
        }

        .favoritos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .favorito-card {
            overflow: hidden;
            border: 1px solid #292929;
            border-radius: 20px;
            background: #101010;
        }

        .favorito-card img {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #151515;
        }

        .favorito-card-info {
            padding: 18px;
        }

        .favorito-card-info h2 {
            margin: 0 0 9px;
            font-size: 16px;
        }

        .favorito-card-price {
            margin: 0 0 14px;
            color: #aaa;
            font-size: 13px;
        }

        .favorito-card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favorito-card-actions .fran7-cart-add {
            flex: 1;
            margin: 0;
        }

        .favorito-card-actions .botao-favorito {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            place-items: center;
            border: 1px solid #484848;
            border-radius: 50%;
            background: transparent;
            color: #f06;
            font-size: 23px;
            cursor: pointer;
        }

        .favoritos-vazio {
            grid-column: 1 / -1;
            padding: 55px 20px;
            border: 1px dashed #444;
            border-radius: 18px;
            color: #aaa;
            text-align: center;
        }

        .favoritos-vazio a {
            display: inline-block;
            margin-top: 12px;
            color: #fff;
        }

        @media (max-width: 480px) {
            .cabecalho {
                gap: clamp(4px, 2vw, 8px);
                padding: 10px 12px;
            }

            .marca {
                flex: 0 1 auto;
                min-width: 0;
            }

            .marca img {
                width: clamp(76px, 26vw, 100px);
            }

            .cabecalho .fran7-favorites-trigger {
                width: 34px;
                height: 34px;
                flex-basis: 34px;
                margin-left: 0;
            }

            .cabecalho .fran7-cart-trigger {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
                margin-left: 0;
            }

            .voltar-loja {
                min-width: 0;
                max-width: 34vw;
                overflow: hidden;
                font-size: clamp(8px, 2.5vw, 10px);
                letter-spacing: 0;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            main {
                width: calc(100% - 32px);
                padding-top: 40px;
            }

            h1 {
                font-size: clamp(28px, 9vw, 36px);
                line-height: 1.1;
                overflow-wrap: anywhere;
            }

            .intro p:last-child {
                font-size: clamp(12px, 3.6vw, 14px);
                line-height: 1.5;
                overflow-wrap: anywhere;
            }

            .favoritos-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
            }

            .favorito-card {
                min-width: 0;
            }

            .favorito-card img {
                height: clamp(140px, 48vw, 180px);
            }

            .favorito-card-info {
                padding: 14px;
            }

            .favorito-card-info h2 {
                font-size: 14px;
            }

            .favorito-card-actions {
                min-width: 0;
                gap: 8px;
            }

            .favorito-card-actions .fran7-cart-add {
                min-width: 0;
                padding-right: 8px;
                padding-left: 8px;
                font-size: 10px;
            }
        }

<body class="fran7-subpage">
    <header class="cabecalho">

    <script>
        (function() {
            "use strict";

            const grid = document.getElementById("favoritosGrid");

            function migrarVistasDaTshirt(favoritos) {
                const imagensRetiradas = new Set([
                    "assets/images/tshirt-lateral.png",
                    "assets/images/tshirt-costas.png"
                ]);
                let alterado = false;

                favoritos.forEach(function(item) {
                    if (item.nome !== "Modelo FRAN7 01" &&
                        item.nome !== "T-shirt FRAN7 Tribal") {
                        return;
                    }

                    const imagens = Array.isArray(item.imagensExtra)
                        ? item.imagensExtra.slice()
                        : [];
                    const vistas = Array.isArray(item.vistas) ? item.vistas.slice() : [];
                    const cores = Array.isArray(item.cores) ? item.cores.slice() : [];
                    const imagensAtualizadas = [];
                    const vistasAtualizadas = [];
                    const coresAtualizadas = [];

                    imagens.forEach(function(imagem, index) {
                        if (typeof imagem !== "string" || !imagem || imagensRetiradas.has(imagem)) {
                            return;
                        }
                        imagensAtualizadas.push(imagem);
                        vistasAtualizadas.push(vistas[index] || "");
                        coresAtualizadas.push(cores[index] || "");
                    });

                    if (JSON.stringify(item.imagensExtra || []) !== JSON.stringify(imagensAtualizadas) ||
                        JSON.stringify(item.vistas || []) !== JSON.stringify(vistasAtualizadas) ||
                        JSON.stringify(item.cores || []) !== JSON.stringify(coresAtualizadas)) {
                        item.imagensExtra = imagensAtualizadas;
                        item.vistas = vistasAtualizadas;
                        item.cores = coresAtualizadas;
                        alterado = true;
                    }
                });

                if (alterado) {
                    localStorage.setItem("fran7_favorites_v1", JSON.stringify(favoritos));
                }
                return favoritos;
            }

            function renderizarFavoritos() {
                let favoritos;
                try {
                    favoritos = JSON.parse(
                        localStorage.getItem("fran7_favorites_v1") || "[]"
                    );
                    if (!Array.isArray(favoritos)) {
                        throw new TypeError("Os favoritos guardados não são uma lista.");
                    }
                } catch (error) {
                    console.error("Não foi possível mostrar os favoritos guardados:", error);
                    grid.replaceChildren();
                    const errorMessage = document.createElement("p");
                    errorMessage.className = "favoritos-vazio";
                    errorMessage.textContent = "Não foi possível carregar os favoritos. Atualiza a página para tentar novamente.";
                    grid.appendChild(errorMessage);
                    return;
                }
                try {
                    favoritos = migrarVistasDaTshirt(favoritos);
                } catch (error) {
                    console.error("Não foi possível atualizar as imagens dos favoritos:", error);
                }

                grid.replaceChildren();
                if (favoritos.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "favoritos-vazio";
                    empty.textContent = "Ainda não guardaste produtos nos favoritos.";
                    const link = document.createElement("a");
                    link.href = "inicio.html#produtos";
                    link.textContent = "Explorar produtos";
                    empty.appendChild(document.createElement("br"));
                    empty.appendChild(link);
                    grid.appendChild(empty);
                    return;
                }

                favoritos.forEach(function(item) {
                    const card = document.createElement("article");
                    card.className = "favorito-card";
                    card.dataset.productName = item.nome;
                    card.dataset.productId = item.productId || "";
                    card.dataset.productPrice = String(Number(item.preco) || 0);
                    card.dataset.productBaseImage = item.imagemBase || item.imagem;
                    card.dataset.productVariants = JSON.stringify(item.variantes || []);
                    card.dataset.productReserve = item.reservar === true ? "true" : "false";
                    card.dataset.galleryImages = (item.imagensExtra || []).join("|");
                    card.dataset.galleryColors = (item.cores || []).join("|");
                    card.dataset.galleryViews = (item.vistas || []).join("|");
                    card.dataset.productBackImage = item.imagemCostas || "";
                    card.dataset.productModel = item.modelo3D || "";

                    const image = document.createElement("img");
                    image.src = item.imagem;
                    image.alt = item.nome;
                    image.loading = "lazy";

                    const info = document.createElement("div");
                    info.className = "favorito-card-info";

                    const name = document.createElement("h2");
                    name.textContent = item.nome;

                    const price = document.createElement("p");
                    price.className = "favorito-card-price";
                    price.textContent = Number(item.preco)
                        ? Number(item.preco).toLocaleString("pt-AO") + " Kz"
                        : "Consultar preço";

                    const actions = document.createElement("div");
                    actions.className = "favorito-card-actions";

                    const add = document.createElement("button");
                    add.type = "button";
                    add.className = "fran7-cart-add";
                    add.textContent = item.reservar === true ? "RESERVAR" : "ADICIONAR À SACOLA";
                    add.dataset.cartName = item.nome;
                    add.dataset.cartImage = item.imagem;
                    add.dataset.cartPrice = String(Number(item.preco) || 0);

                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "botao-favorito ativo";
                    remove.dataset.favoriteName = item.nome;
                    remove.dataset.favoriteImage = item.imagem;
                    remove.dataset.favoriteBaseImage = item.imagemBase || item.imagem;
                    remove.dataset.favoriteVariants = JSON.stringify(item.variantes || []);
                    remove.dataset.favoritePrice = String(Number(item.preco) || 0);
                    remove.dataset.favoriteReserve = item.reservar === true ? "true" : "false";
                    remove.dataset.favoriteImages = (item.imagensExtra || []).join("|");
                    remove.dataset.favoriteViews = (item.vistas || []).join("|");
                    remove.dataset.favoriteColors = (item.cores || []).join("|");
                    remove.dataset.favoriteBackImage = item.imagemCostas || "";
                    remove.dataset.favoriteModel = item.modelo3D || "";
                    remove.setAttribute("aria-label", "Remover dos favoritos");
                    remove.setAttribute("aria-pressed", "true");
                    remove.innerHTML = '<span class="coracao" aria-hidden="true">♥</span>';

                    actions.append(add, remove);
                    info.append(name, price, actions);
                    card.append(image, info);
                    grid.appendChild(card);
                });
            }

            window.addEventListener("fran7-favorites-updated", renderizarFavoritos);
            window.addEventListener("storage", function(event) {
                if (event.key === "fran7_favorites_v1") {
                    renderizarFavoritos();
                }
            });
            renderizarFavoritos();
        })();
    </script>
